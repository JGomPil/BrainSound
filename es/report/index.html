async function open_(pw) {
  const k0 = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const k = await crypto.subtle.deriveKey({name: "PBKDF2", salt: b(D.s), iterations: D.i, hash: "SHA-256"}, k0,

  try { sessionStorage.setItem("bs_pw", pw); } catch (e) {}
  const html = new TextDecoder().decode(pt);
  document.open(); document.write(html); document.close();
